services:
  - type: web
    runtime: static
    name: forfaits-cameroun-v1
    buildCommand: echo "No build required"
    staticPublishPath: public
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
